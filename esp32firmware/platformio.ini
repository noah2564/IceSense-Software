[platformio]
default_envs = esp32-s3

[env]
platform = espressif32@^6.9.0
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.0
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINOJSON_USE_LONG_LONG=1

[env:esp32-s3]
board = esp32-s3-devkitc-1

[env:esp32dev]
board = esp32dev
