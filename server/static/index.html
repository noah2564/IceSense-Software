<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ice Sensing Monitor</title>
<style>
  :root { --bg:#fff; --fg:#1a1d21; --muted:#6b7280; --card:#f4f5f7; --line:#dfe3e8; --accent:#2563eb;
          --ok:#15803d; --warn:#b45309; --bad:#b91c1c; --info:#0369a1; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#101317; --fg:#e6e8eb; --muted:#9aa3ad; --card:#181d23; --line:#2a313a; --accent:#60a5fa;
            --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; --info:#38bdf8; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 system-ui, sans-serif; }
  header { padding:14px 16px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:baseline; }
  header h1 { font-size:16px; margin:0; } header span { color:var(--muted); }
  main { display:grid; grid-template-columns: 240px 1fr; gap:16px; padding:16px; max-width:1200px; margin:0 auto; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px; margin-bottom:16px; }
  .card h2 { font-size:12px; margin:0 0 8px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
  .dev { display:block; width:100%; text-align:left; background:none; border:1px solid transparent; color:inherit;
         border-radius:6px; padding:8px; cursor:pointer; font:inherit; }
  .dev.sel { border-color:var(--accent); } .dev small { display:block; color:var(--muted); }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; background:var(--muted); }
  .dot.on { background:var(--ok); } .dot.off { background:var(--bad); }
  .badge { display:inline-block; padding:2px 8px; border-radius:10px; font-weight:600; font-size:12px; border:1px solid currentColor; }
  .s-clear { color:var(--ok); } .s-frost, .s-wet { color:var(--info); } .s-ice { color:var(--bad); } .s-unknown { color:var(--muted); }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:8px; }
  select, button.act { font:inherit; padding:5px 8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); }
  button.act { cursor:pointer; } button.act:hover { border-color:var(--accent); }
  table { width:100%; border-collapse:collapse; } td, th { text-align:left; padding:4px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:500; } .muted { color:var(--muted); }
  canvas { max-height:320px; }
</style>
</head>
<body>
<header><h1>Ice Sensing Monitor</h1><span id="clock"></span></header>
<main>
  <aside>
    <div class="card"><h2>Devices</h2><div id="devices"><span class="muted">No devices yet.</span></div></div>
  </aside>
  <section>
    <div class="card"><h2>Assessment</h2><div id="assessment" class="muted">Select a device.</div></div>
    <div class="card">
      <h2>Measurements</h2>
      <div class="row">
        <select id="metric" aria-label="Metric"></select>
        <select id="range" aria-label="Time range">
          <option value="15">last 15 min</option><option value="60" selected>last hour</option>
          <option value="1440">last 24 h</option>
        </select>
      </div>
      <canvas id="chart"></canvas>
    </div>
    <div class="card">
      <h2>Device</h2>
      <div id="status" class="muted" style="margin-bottom:8px"></div>
      <div class="row">
        <button class="act" id="btn-baseline">Capture baseline (coil must be clean)</button>
        <button class="act" id="btn-status">Request status</button>
        <span id="cmdresult" class="muted"></span>
      </div>
    </div>
    <div class="card"><h2>Recent events, calibrations and command results</h2><div id="msgs"></div></div>
    <div class="card"><h2>Rejected messages (schema violations)</h2><div id="rejected" class="muted">none</div></div>
  </section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
const $ = (s) => document.querySelector(s);
let current = null, chart = null;

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error(path + ": " + r.status + " " + await r.text());
  return r.json();
}
function el(tag, text, cls) { const e = document.createElement(tag); if (text !== undefined) e.textContent = text; if (cls) e.className = cls; return e; }
function ago(ms) { const s = Math.round((Date.now() - ms) / 1000); return s < 90 ? s + " s ago" : s < 5400 ? Math.round(s/60) + " min ago" : Math.round(s/3600) + " h ago"; }

async function refreshDevices() {
  const devs = await api("/api/devices");
  const box = $("#devices");
  box.replaceChildren();
  if (!devs.length) { box.append(el("span", "No devices yet.", "muted")); return; }
  if (!current) select(devs[0].device_id);
  for (const d of devs) {
    const b = el("button", undefined, "dev" + (d.device_id === current ? " sel" : ""));
    const dot = el("span", "", "dot " + (d.online === true ? "on" : d.online === false ? "off" : ""));
    b.append(dot, d.device_id);
    b.append(el("small", (d.state || "no data") + " · " + ago(d.last_seen) + (d.gaps ? " · " + d.gaps + " lost" : "")));
    b.onclick = () => select(d.device_id);
    box.append(b);
  }
}

async function select(id) { current = id; await loadMetrics(); await refresh(); }

async function loadMetrics() {
  const list = await api(`/api/devices/${current}/channels`);
  const sel = $("#metric"), prev = sel.value;
  sel.replaceChildren();
  for (const m of list) { const o = el("option", `${m.channel_id} · ${m.metric}`); o.value = `${m.channel_id}|${m.metric}`; sel.append(o); }
  const prefer = [...sel.options].find(o => o.value === "cap-1|capacitive.delta_pct");
  sel.value = [...sel.options].some(o => o.value === prev) ? prev : (prefer ? prefer.value : sel.value);
}

async function refreshChart() {
  const v = $("#metric").value; if (!v || !current) return;
  const [ch, metric] = v.split("|");
  const since = Date.now() - Number($("#range").value) * 60000;
  const data = await api(`/api/devices/${current}/series?channel_id=${encodeURIComponent(ch)}&metric=${encodeURIComponent(metric)}&since_ms=${since}`);
  const labels = data.map(p => new Date(p[0]).toLocaleTimeString());
  const values = data.map(p => p[1]);
  if (!chart) {
    chart = new Chart($("#chart"), { type: "line",
      data: { labels, datasets: [{ label: v, data: values, borderColor: "#2563eb", pointRadius: 0, tension: .2 }] },
      options: { animation: false, responsive: true, plugins: { legend: { display: false } }, scales: { x: { ticks: { maxTicksLimit: 8 } } } } });
  } else { chart.data.labels = labels; chart.data.datasets[0].data = values; chart.data.datasets[0].label = v; chart.update(); }
}

async function refreshAssessment() {
  const rows = await api(`/api/devices/${current}/assessments?limit=1`);
  const box = $("#assessment"); box.replaceChildren();
  if (!rows.length) { box.textContent = "No telemetry yet."; return; }
  const a = rows[0];
  box.append(el("span", a.state.toUpperCase(), "badge s-" + a.state), " ", el("span", a.reason, "muted"));
  if (a.defrost_recommended) box.append(el("div", "Defrost recommended", "s-ice"));
  box.append(el("div", "computed by " + a.algorithm.name + " " + a.algorithm.version + " (placeholder thresholds) · " + ago(a.ts), "muted"));
}

async function refreshStatus() {
  const s = await api(`/api/devices/${current}/status`);
  const box = $("#status");
  if (!s.status) { box.textContent = "No status message received yet."; return; }
  const c = s.status.connectivity || {}, sys = s.status.system || {}, b = s.status.buffering || {};
  box.textContent = `health: ${s.status.health} · RSSI ${c.rssi_dbm ?? "?"} dBm · free heap ${sys.free_heap_bytes ?? "?"} B · ` +
    `queued ${b.queued_messages ?? "?"} / dropped ${b.dropped_messages ?? "?"} · reconnects ${c.reconnect_count ?? "?"} · reported ${ago(s.last_seen)}`;
}

async function refreshMsgs() {
  const rows = await api(`/api/devices/${current}/messages?message_type=event,calibration,command_ack,command&limit=12`);
  const t = el("table");
  const head = el("tr"); for (const h of ["when", "dir", "type", "summary"]) head.append(el("th", h)); t.append(head);
  for (const r of rows) {
    const m = r.message, tr = el("tr");
    let summary = "";
    if (m.event) summary = `${m.event.event_type} (${m.event.severity})`;
    else if (m.calibration) summary = `${m.calibration.calibration_type} ${m.calibration.channel_id}: ${m.calibration.state}`;
    else if (m.command_ack) summary = `${m.command_ack.command_id}: ${m.command_ack.result}`;
    else if (m.command) summary = `${m.command.command_type} ${m.command.command_id}`;
    tr.append(el("td", ago(r.received_at)), el("td", r.direction), el("td", r.message_type), el("td", summary));
    t.append(tr);
  }
  $("#msgs").replaceChildren(rows.length ? t : el("span", "nothing yet", "muted"));
}

async function refreshRejected() {
  const rows = await api("/api/rejected?limit=5");
  const box = $("#rejected"); box.replaceChildren();
  if (!rows.length) { box.textContent = "none"; return; }
  for (const r of rows) box.append(el("div", `${ago(r.received_at)} · ${r.topic}: ${r.errors.join("; ")}`, "s-ice"));
}

async function refresh() {
  $("#clock").textContent = new Date().toLocaleString();
  try {
    await refreshDevices();
    if (current) await Promise.all([refreshChart(), refreshAssessment(), refreshStatus(), refreshMsgs()]);
    await refreshRejected();
  } catch (e) { console.error(e); }
}

async function command(type, params) {
  try {
    const r = await api(`/api/devices/${current}/commands`, { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ command_type: type, params }) });
    $("#cmdresult").textContent = "sent " + r.command_id;
    setTimeout(refresh, 1500);
  } catch (e) { $("#cmdresult").textContent = "failed: " + e.message; }
}
$("#btn-baseline").onclick = () => { if (confirm("Capture the current readings as the clean baseline? Only do this when the coil is known to be clean and dry.")) command("capture_baseline"); };
$("#btn-status").onclick = () => command("get_status");
$("#metric").onchange = refreshChart; $("#range").onchange = refreshChart;
refresh(); setInterval(refresh, 5000);
</script>
</body>
</html>
